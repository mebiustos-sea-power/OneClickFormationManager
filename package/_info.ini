[Language_en]
Name=One Click Formation Manager
Description=Single-click a unit row in the formation manager to select it and switch the camera, just like the original double-click action. Covers individual units and formation members in every tab. Buttons, reorder handles and dragging keep their original behavior. Requires Anchor Chain. Enable this mod, then restart the game.

[Language_ja]
Name=One Click Formation Manager
Description=編隊マネージャーのユニット行をワンクリックすると、従来のダブルクリックと同じユニット選択・カメラ切替を行います。全タブの単独ユニットと編隊内メンバーに対応します。ボタン・並べ替えハンドル・ドラッグは従来の操作を維持します。Anchor Chainが必要です。有効にした後、ゲームを再起動してください。
