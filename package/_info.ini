[Language_en]
Name=One Click Formation Manager
Description=Single-click a unit row or formation name in the formation manager to select the unit or formation leader and switch the camera. Double-click a formation name to expand or collapse its members. Expansion arrows only expand or collapse the list. Covers individual units and formation members in every tab. Buttons, reorder handles and dragging keep their original behavior. Requires Anchor Chain. Enable this mod, then restart the game.

[Language_ja]
Name=One Click Formation Manager
Description=編隊マネージャーのユニット行や編隊名をワンクリックすると、ユニットまたは編隊リーダーの選択とカメラ切替を行います。編隊名のダブルクリックで一覧を開閉できます。展開用の矢印は一覧の開閉だけを行います。全タブの単独ユニットと編隊内メンバーに対応します。ボタン・並べ替えハンドル・ドラッグは従来の操作を維持します。Anchor Chainが必要です。有効にした後、ゲームを再起動してください。
